<!DOCTYPE html>
<html>
<head>
<title>Update Student</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(to right, #4facfe, #00f2fe);
    text-align: center;
}

h2 {
    color: white;
    margin-top: 30px;
}

.box {
    width: 340px;
    margin: 30px auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0px 8px 20px rgba(0,0,0,0.3);
}

input {
    width: 75%;
    padding: 7px;
    margin: 6px 0;
}

input[type="submit"] {
    width: 80%;
    background: #0072ff;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 6px;
}

a {
    display: block;
    margin-top: 10px;
    text-decoration: none;
    color: #0072ff;
}
</style>

</head>

<body>

<h2>Update Student Details</h2>

<div class="box">
<form action="UpdateServlet" method="post">

    <input type="text" name="id" placeholder="Enter ID" required>
    <input type="text" name="roll" placeholder="Enter Roll No" required>
    <input type="text" name="name" placeholder="Enter Name" required>

    <input type="number" name="math" placeholder="Math" required>
    <input type="number" name="hindi" placeholder="Hindi" required>
    <input type="number" name="english" placeholder="English" required>
    <input type="number" name="sanskrit" placeholder="Sanskrit" required>
    <input type="number" name="social" placeholder="Social" required>
    <input type="number" name="computer" placeholder="Computer" required>

    <input type="submit" value="Update">

</form>

<a href="index.html">Back</a>
</div>

</body>
</html>
